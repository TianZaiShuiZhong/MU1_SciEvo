[project]
name = "mu1-scievo"
version = "0.1.0"
description = "Sci-Evo dataset pipeline for AGI4S contest"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.32.0",
  "jsonschema>=4.23.0",
  "python-dotenv>=1.0.1",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
